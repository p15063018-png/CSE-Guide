<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Polytechnic Video Guide</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #667eea;
      text-align: center;
      margin-bottom: 10px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      transition: border-color 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .toggle-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }

    .toggle-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message {
      background: #dcfce7;
      color: #16a34a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <h1 id="form-title">Login</h1>
    <p class="subtitle">Polytechnic Video Guide</p>

    <div id="error-msg" class="error-message"></div>
    <div id="success-msg" class="success-message"></div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="your@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6" />
      </div>

      <button type="submit" class="btn" id="submit-btn">Login</button>
    </form>

    <div class="divider">or</div>

    <div class="toggle-link">
      <span id="toggle-text">Don't have an account?</span>
      <a id="toggle-link">Create account</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const authForm = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const formTitle = document.getElementById("form-title");
    const toggleText = document.getElementById("toggle-text");
    const toggleLink = document.getElementById("toggle-link");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    let isLoginMode = true;

    // Toggle between login and register
    toggleLink.addEventListener("click", function () {
      isLoginMode = !isLoginMode;

      if (isLoginMode) {
        formTitle.textContent = "Login";
        submitBtn.textContent = "Login";
        toggleText.textContent = "Don't have an account?";
        toggleLink.textContent = "Create account";
      } else {
        formTitle.textContent = "Create Account";
        submitBtn.textContent = "Sign Up";
        toggleText.textContent = "Already have an account?";
        toggleLink.textContent = "Login";
      }

      clearMessages();
    });

    // Handle form submission
    authForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearMessages();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Please wait...";

      try {
        if (isLoginMode) {
          // Login
          await signInWithEmailAndPassword(auth, email, password);
          showSuccess("Login successful! Redirecting...");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          // Register
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Update display name (optional)
          await updateProfile(user, {
            displayName: email.split("@")[0]
          });

          showSuccess("Account created successfully! Redirecting...");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        }
      } catch (error) {
        showError(getErrorMessage(error.code));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? "Login" : "Sign Up";
      }
    });

    function showSuccess(message) {
      successMsg.textContent = message;
      successMsg.style.display = "block";
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = "block";
    }

    function clearMessages() {
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
    }

    function getErrorMessage(errorCode) {
      switch (errorCode) {
        case "auth/invalid-email":
          return "Invalid email address.";
        case "auth/user-disabled":
          return "This account has been disabled.";
        case "auth/user-not-found":
          return "No account found with this email.";
        case "auth/wrong-password":
          return "Incorrect password.";
        case "auth/email-already-in-use":
          return "This email is already registered.";
        case "auth/weak-password":
          return "Password should be at least 6 characters.";
        case "auth/operation-not-allowed":
          return "Email/password accounts are not enabled.";
        default:
          return "Something went wrong. Please try again.";
      }
    }
  </script>
</body>
</html>
